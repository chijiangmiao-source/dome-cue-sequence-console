services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: show
      POSTGRES_PASSWORD: show
      POSTGRES_DB: showctl
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U show -d showctl"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://show:show@db:5432/showctl
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"

  # 一次性验收服务：跑完 pytest + Vitest + Playwright 后退出。
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: http://web
      DATABASE_DSN: postgresql://show:show@db:5432/showctl
    restart: "no"

volumes:
  dbdata:
